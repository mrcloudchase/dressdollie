<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dress Dollie</title>
<meta name="description" content="A fun dress-up game: pick a fashion doll, then choose her hair, dresses, shoes, sparkly extras and a magical place to visit.">
<style>
  :root{
    --pink:#ff5fa8; --pink-d:#e0408a; --pink-l:#ffe3f1; --lav:#f3e8ff; --ink:#4a2d5c;
    --card:#fff; --ring:#ffb300;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#ffd9ee,#e9dcff 60%,#d8f1ff);
    overflow:hidden;
  }
  .app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:12px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .stage{position:relative;border-radius:28px;background:#fff;box-shadow:0 8px 24px rgba(120,60,140,.25),inset 0 0 0 5px #fff;overflow:hidden;min-height:0;border:5px solid #fff}
  #bg,#doll{position:absolute;inset:0;width:100%;height:100%;display:block}
  #dollG{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
  .twirl #dollG{animation:twirl .9s ease-in-out}
  @keyframes twirl{0%{transform:scaleX(1)}25%{transform:scaleX(.05)}50%{transform:scaleX(-1)}75%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
  .title{position:absolute;left:14px;top:10px;font-weight:900;font-size:clamp(18px,3.2vw,28px);color:#fff;text-shadow:0 2px 0 var(--pink-d),0 4px 8px rgba(0,0,0,.2);letter-spacing:.5px;pointer-events:none}
  .actions{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
  .round{width:52px;height:52px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 #d8b8ea,0 6px 12px rgba(0,0,0,.18);font-size:26px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
  .round:active{transform:translateY(2px);box-shadow:0 1px 0 #d8b8ea}
  .round small{display:none}
  .sparkle{position:absolute;pointer-events:none;font-size:22px;color:#ffd23f;text-shadow:0 0 6px #fff,0 0 10px #ff9fd0;animation:pop .9s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(120deg)}}

  .panel{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.85);border-radius:28px;box-shadow:0 8px 24px rgba(120,60,140,.2);overflow:hidden}
  .tabs{display:flex;gap:6px;padding:10px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:6px 8px;border:0;border-radius:18px;background:var(--lav);color:var(--ink);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .tab .ic{font-size:24px;line-height:1}
  .tab[aria-selected=true]{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
  .grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;grid-auto-rows:max-content;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;align-content:start}
  .tile{display:flex;flex-direction:column;align-items:stretch;border:3px solid transparent;border-radius:20px;background:var(--card);box-shadow:0 3px 0 #e6d3f2;padding:4px;cursor:pointer;font:inherit;color:var(--ink)}
  .pic{position:relative;display:block;width:100%;aspect-ratio:1/1}
  .pic svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .tile:active{transform:scale(.96)}
  .tile[aria-pressed=true]{border-color:var(--ring);background:#fffbe8;box-shadow:0 0 0 3px #fff3b0,0 3px 0 #e6b800}
  .tile .nm{display:flex;align-items:center;justify-content:center;min-height:2.4em;padding:3px 2px 1px;text-align:center;font-size:12px;line-height:1.15;font-weight:800}
  .tile.none{justify-content:center;align-items:center;min-height:96px;font-size:34px;background:var(--lav)}
  .sect{grid-column:1/-1;font-weight:900;font-size:13px;margin:6px 2px 0;color:var(--pink-d);letter-spacing:.4px;text-transform:uppercase}
  .swatches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding:2px}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e0cdf0,0 2px 4px rgba(0,0,0,.2);cursor:pointer;padding:0}
  .sw[aria-pressed=true]{box-shadow:0 0 0 4px var(--ring),0 2px 4px rgba(0,0,0,.2);transform:scale(1.1)}
  .colorbar{flex:none;padding:8px 12px 12px;border-top:2px dashed #e6d3f2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:rgba(255,255,255,.7)}
  .colorbar[hidden]{display:none}
  .colorbar .lbl{font-weight:900;font-size:13px;color:var(--pink-d);margin-right:4px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,46%);gap:8px;padding:8px}
    .round{width:44px;height:44px;font-size:22px}
    .tab{min-width:58px}
    .sw{width:30px;height:30px}
    .colorbar{gap:6px;padding:6px 10px 8px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
  }
  @media (prefers-reduced-motion:reduce){
    #dollG{animation:none}.sparkle{animation-duration:.01s}
  }
  button:focus-visible{outline:4px solid #7c4dff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage" aria-label="Your doll">
    <svg id="bg" viewBox="0 0 300 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <svg id="doll" viewBox="0 0 300 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your fashion doll"></svg>
    <div class="title">✨ Dress Dollie ✨</div>
    <div class="actions">
      <button class="round" id="btnSurprise" title="Surprise me!" aria-label="Surprise me">🎲</button>
      <button class="round" id="btnTwirl" title="Twirl!" aria-label="Twirl">💃</button>
      <button class="round" id="btnSave" title="Save a picture" aria-label="Save a picture">📸</button>
      <button class="round" id="btnSound" title="Sound on/off" aria-label="Sound on or off">🔊</button>
      <button class="round" id="btnReset" title="Start over" aria-label="Start over">🔄</button>
    </div>
  </section>
  <section class="panel" aria-label="Choose things">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="grid" id="grid"></div>
    <div class="colorbar" id="colorbar" hidden></div>
  </section>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const M = x => `<g>${x}</g><g transform="translate(300 0) scale(-1 1)">${x}</g>`; // mirror pair (left drawn, right mirrored)
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, k = Math.abs(p);
  r = Math.round((t - r) * k + r); g = Math.round((t - g) * k + g); b = Math.round((t - b) * k + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function star(cx, cy, R, r, fill){
  const p = [];
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    p.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1));
  }
  return `<polygon points="${p.join(' ')}" fill="${fill}"/>`;
}
const heart = (cx, cy, s, fill, op = 1) => `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0 8 C-14 -4 -6 -14 0 -6 C6 -14 14 -4 0 8Z" fill="${fill}" opacity="${op}"/>`;
const flower = (x, y, c = '#fff') => `<g>${[0, 72, 144, 216, 288].map(a => `<circle cx="${(x + 4 * Math.cos(a * Math.PI / 180)).toFixed(1)}" cy="${(y + 4 * Math.sin(a * Math.PI / 180)).toFixed(1)}" r="3" fill="${c}"/>`).join('')}<circle cx="${x}" cy="${y}" r="2.2" fill="#ffd23f"/></g>`;

/* ---------- palettes ---------- */
const SKINS = ['#fde2cf', '#f6d3b8', '#e8b894', '#c68e63', '#9b6440', '#6b4129'];
const EYES = ['#4aa3df', '#4fb36e', '#7a4a2a', '#9b6be0', '#b88a2e'];
const HAIRS = ['#f2cf6b', '#f4ecd8', '#8a5a3a', '#2b2330', '#d1502f', '#ff8fc4', '#b57be0', '#66b8f0'];
const CLOTH = ['#ff7eb6', '#ff4f9a', '#e63946', '#ff9f45', '#ffd23f', '#6fcf97', '#2ec4b6', '#5aa9ff', '#8b7bff', '#c77dff', '#ffffff', '#3b3b4f'];

const DOLLS = [
  { id: 'mia',  name: 'Mia',  skin: '#f6d3b8', eyes: '#4aa3df', hairStyle: 'long',     hairColor: '#f2cf6b' },
  { id: 'zoe',  name: 'Zoe',  skin: '#9b6440', eyes: '#7a4a2a', hairStyle: 'curly',    hairColor: '#2b2330' },
  { id: 'lily', name: 'Lily', skin: '#fde2cf', eyes: '#4fb36e', hairStyle: 'ponytail', hairColor: '#d1502f' },
  { id: 'ava',  name: 'Ava',  skin: '#c68e63', eyes: '#b88a2e', hairStyle: 'braid',    hairColor: '#8a5a3a' },
  { id: 'nia',  name: 'Nia',  skin: '#6b4129', eyes: '#7a4a2a', hairStyle: 'bun',      hairColor: '#2b2330' },
  { id: 'kiki', name: 'Kiki', skin: '#e8b894', eyes: '#9b6be0', hairStyle: 'pigtails', hairColor: '#ff8fc4' },
];

/* ---------- body ---------- */
const TORSO = 'M120 160 C128 156 172 156 180 160 L176 200 C172 220 168 232 170 245 C178 262 184 278 182 296 L118 296 C116 278 122 262 130 245 C132 232 128 220 124 200 Z';
function bodySVG(st){
  const s = st.skin, sd = shade(s, -.12);
  return `
  ${M(`<path d="M119 292 L149 292 C149 340 147 380 146 420 C145 470 143 520 141 560 L127 560 C127 520 124 470 123 420 C121 380 119 340 119 292Z" fill="${s}"/>
       <path d="M126 556 L141 556 L145 574 Q147 584 137 584 L121 584 Q115 582 118 574 Z" fill="${s}"/>
       <path d="M121 162 C109 176 105 216 101 256 C99 282 97 302 99 318 L110 320 C113 302 119 272 125 246 C129 222 129 192 130 170Z" fill="${s}"/>
       <circle cx="104.500" cy="322" r="7" fill="${s}"/>`)}
  <path d="M141 126 L159 126 L161 162 L139 162Z" fill="${s}"/>
  <path d="M139 150 Q150 158 161 150 L161 162 L139 162Z" fill="${sd}" opacity=".35"/>
  <path d="${TORSO}" fill="${s}"/>
  <path d="${TORSO}" fill="#fbe0ec"/>
  <path d="M132 160 L136 176 M168 160 L164 176" stroke="#fbe0ec" stroke-width="5" stroke-linecap="round"/>
  <path d="M136 176 Q150 188 164 176" stroke="${s}" stroke-width="0" fill="none"/>`;
}
function faceSVG(st){
  const s = st.skin, sd = shade(s, -.14), hd = shade(st.hairColor, -.3);
  return `
  ${M(`<circle cx="112" cy="96" r="6" fill="${s}"/>`)}
  <ellipse cx="150" cy="92" rx="38" ry="43" fill="${s}"/>
  ${M(`<ellipse cx="125" cy="110" rx="6.500" ry="4" fill="#ff7a9a" opacity=".32"/>
       <ellipse cx="136" cy="97" rx="7.500" ry="8.500" fill="#fff"/>
       <circle cx="136" cy="98" r="5.600" fill="${st.eyes}"/>
       <circle cx="136" cy="98" r="2.700" fill="#241a2b"/>
       <circle cx="138.200" cy="95.600" r="1.900" fill="#fff"/>
       <path d="M127.500 94 Q136 86 144.500 93" stroke="#3a2a3a" stroke-width="2.400" fill="none" stroke-linecap="round"/>
       <path d="M127.500 94 L124 90.500" stroke="#3a2a3a" stroke-width="2" stroke-linecap="round"/>
       <path d="M127 84 Q136 78 145 83" stroke="${hd}" stroke-width="2.200" fill="none" stroke-linecap="round"/>`)}
  <path d="M148.500 109 Q150 112 151.500 109" stroke="${sd}" stroke-width="1.700" fill="none" stroke-linecap="round"/>
  <path d="M141 118 Q150 129 159 118 Q150 122 141 118Z" fill="#e8506e"/>
  <path d="M145 121.500 Q150 124 155 121.500" stroke="#fff" stroke-width="1.200" fill="none" opacity=".7"/>`;
}

/* ---------- hair ---------- */
const CAP = c => `<path d="M108 100 C104 48 128 36 150 36 C172 36 196 48 192 100 C190 84 184 72 170 66 C160 74 140 78 120 70 C112 78 109 90 108 100Z" fill="${c}"/>
 <path d="M122 52 C134 42 156 40 172 48" stroke="${shade(c, .45)}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>`;
const HAIR = {
  long: {
    name: 'Long',
    back: c => `<path d="M104 90 C96 40 204 40 196 90 C204 150 206 230 196 284 C180 296 120 296 104 284 C94 230 96 150 104 90Z" fill="${shade(c, -.1)}"/>`,
    front: c => CAP(c)
  },
  ponytail: {
    name: 'Ponytail',
    back: c => `<path d="M176 66 C228 48 252 112 234 204 C230 230 208 228 214 202 C224 142 206 102 176 92Z" fill="${shade(c, -.1)}"/>`,
    front: c => CAP(c) + `<circle cx="181" cy="68" r="6" fill="#ff4f9a"/><circle cx="179" cy="66" r="2" fill="#fff" opacity=".6"/>`
  },
  pigtails: {
    name: 'Pigtails',
    back: c => M(`<path d="M114 82 C78 92 74 156 88 208 C96 224 110 212 104 194 C100 152 112 122 124 102Z" fill="${shade(c, -.1)}"/>`),
    front: c => CAP(c) + M(`<circle cx="113" cy="86" r="5.500" fill="#ff4f9a"/>`)
  },
  bob: {
    name: 'Bob',
    back: c => `<path d="M104 90 C94 40 206 40 196 90 C204 126 202 158 192 172 C170 182 130 182 108 172 C98 158 96 126 104 90Z" fill="${shade(c, -.1)}"/>`,
    front: c => CAP(c)
  },
  bun: {
    name: 'Bun',
    back: c => '',
    front: c => CAP(c) + `<circle cx="150" cy="30" r="19" fill="${c}"/><path d="M138 24 Q148 16 160 20" stroke="${shade(c, .45)}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/><rect x="134" y="40" width="32" height="7" rx="3.500" fill="#ff4f9a"/>`
  },
  curly: {
    name: 'Curly',
    back: c => [[100, 80], [94, 108], [96, 138], [102, 164], [108, 52], [130, 36], [170, 36], [192, 52], [200, 80], [206, 108], [204, 138], [198, 164]]
      .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="19" fill="${shade(c, -.1)}"/>`).join(''),
    front: c => CAP(c) + [[110, 62], [126, 48], [150, 42], [174, 48], [190, 62]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="${c}"/>`).join('')
  },
  bald: {
    name: 'No hair',
    back: c => '',
    front: c => `<ellipse cx="134" cy="60" rx="15" ry="6" fill="#fff" opacity=".22" transform="rotate(-22 134 60)"/>`
  },
  braid: {
    name: 'Braid',
    back: c => `<path d="M104 90 C94 40 206 40 196 90 C202 126 198 150 190 164 C170 172 130 172 110 164 C102 150 98 126 104 90Z" fill="${shade(c, -.1)}"/>`,
    front: c => CAP(c) + Array.from({ length: 8 }, (_, i) => `<ellipse cx="${186 + i * .8}" cy="${112 + i * 19}" rx="${10 - i * .4}" ry="12" fill="${i % 2 ? shade(c, -.12) : c}"/>`).join('') + `<circle cx="192" cy="266" r="5" fill="#ff4f9a"/>`
  }
};

/* ---------- clothes ---------- */
const DRESS_P = {
  ball:  'M121 176 Q150 186 179 176 L176 232 C192 300 240 400 254 502 Q150 528 46 502 C60 400 108 300 124 232Z',
  party: 'M121 180 Q150 190 179 180 L176 236 C196 300 206 345 214 372 Q150 392 86 372 C94 345 104 300 124 236Z',
};
const clipBand = (id, path, inner) => `<clipPath id="${id}"><path d="${path}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;
const DRESSES = [
  { id: 'ball', name: 'Ball gown', draw: c => { const d = shade(c, -.2), l = shade(c, .45); return `
    <path d="${DRESS_P.ball}" fill="${c}"/>
    <path d="M150 250 C150 340 140 430 118 512 M150 250 C150 340 160 430 182 512" stroke="${d}" stroke-width="3" opacity=".3" fill="none"/>
    <path d="M124 232 L176 232 L177 247 L123 247Z" fill="${d}"/>
    <path d="M128 160 L134 182 M172 160 L166 182" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 492 Q150 516 240 492" stroke="${l}" stroke-width="6" fill="none" stroke-linecap="round"/>
    ${star(100, 440, 7, 3, l)}${star(196, 410, 6, 2.5, l)}${star(150, 360, 7, 3, l)}${star(120, 330, 5, 2, l)}${star(180, 470, 6, 2.5, l)}`; } },
  { id: 'party', name: 'Party dress', draw: c => { const d = shade(c, -.2), l = shade(c, .5); return `
    <path d="${DRESS_P.party}" fill="${c}"/>
    <path d="M128 160 L134 184 M172 160 L166 184" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    <path d="M124 236 L176 236 L177 250 L123 250Z" fill="${d}"/>
    <path d="M150 243 L134 232 L134 254Z M150 243 L166 232 L166 254Z" fill="${l}"/><circle cx="150" cy="243" r="4.500" fill="${d}"/>
    <path d="M92 366 Q150 384 208 366" stroke="${l}" stroke-width="5" fill="none"/>
    ${[[120, 300], [170, 290], [145, 330], [185, 340], [110, 345]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.500" fill="${l}"/>`).join('')}`; } },
  { id: 'mermaid', name: 'Mermaid gown', draw: c => { const d = shade(c, -.2), l = shade(c, .4); return `
    <path d="M121 178 Q150 188 179 178 L176 232 C184 290 182 380 178 440 C190 490 210 530 222 548 Q150 530 78 548 C90 530 110 490 122 440 C118 380 116 290 124 232Z" fill="${c}"/>
    <path d="M128 160 L134 182 M172 160 L166 182" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    ${Array.from({ length: 6 }, (_, r) => Array.from({ length: 3 }, (_, k) => `<path d="M${126 + k * 20 + (r % 2) * 10} ${290 + r * 28} q10 14 20 0" stroke="${l}" stroke-width="2" fill="none" opacity=".8"/>`).join('')).join('')}
    <path d="M124 232 L176 232 L177 246 L123 246Z" fill="${d}"/>
    <path d="M90 538 Q150 524 210 538" stroke="${l}" stroke-width="5" fill="none" stroke-linecap="round"/>`; } },
  { id: 'princess', name: 'Princess', draw: c => { const d = shade(c, -.2), l = shade(c, .45); return `
    <path d="M121 176 Q150 186 179 176 L176 232 C196 300 236 390 248 486 Q200 500 150 490 Q100 500 52 486 C64 390 104 300 124 232Z" fill="${c}"/>
    <path d="M70 420 Q150 450 230 420 L238 470 Q150 500 62 470Z" fill="${l}" opacity=".55"/>
    <path d="M124 232 L176 232 L177 247 L123 247Z" fill="${d}"/>
    <path d="M136 176 Q150 190 164 176" stroke="${l}" stroke-width="4" fill="none"/>
    ${M(`<circle cx="113" cy="174" r="14" fill="${c}"/><circle cx="113" cy="174" r="14" fill="${l}" opacity=".25"/><path d="M104 184 Q113 190 122 184" stroke="${d}" stroke-width="3" fill="none"/>`)}
    ${heart(150, 262, .9, l)}${star(110, 450, 6, 2.5, '#fff')}${star(190, 440, 6, 2.5, '#fff')}${star(150, 400, 7, 3, '#fff')}${star(130, 340, 5, 2, '#fff')}`; } },
  { id: 'sun', name: 'Flower dress', draw: c => { const d = shade(c, -.2); return `
    <path d="M121 178 Q150 188 179 178 L176 236 C194 300 206 380 216 430 Q150 450 84 430 C94 380 106 300 124 236Z" fill="${c}"/>
    <path d="M124 160 L128 182 M176 160 L172 182" stroke="${c}" stroke-width="8" stroke-linecap="round"/>
    <path d="M124 234 L176 234 L177 246 L123 246Z" fill="${d}"/>
    ${[[110, 330], [150, 300], [185, 340], [130, 395], [175, 400], [100, 420], [200, 420], [150, 350]].map(([x, y]) => flower(x, y, '#fff')).join('')}`; } },
  { id: 'rainbow', name: 'Rainbow', fixed: true, draw: () => {
    const cols = ['#ff5b5b', '#ff9f45', '#ffd23f', '#6fcf97', '#5aa9ff', '#8b7bff', '#ff7eb6'];
    return clipBand('clipRb', DRESS_P.party, cols.map((k, i) => `<rect x="60" y="${170 + i * 30}" width="190" height="30" fill="${k}"/>`).join('')) +
      `<path d="M128 160 L134 184 M172 160 L166 184" stroke="#ff5b5b" stroke-width="6" stroke-linecap="round"/>` +
      star(150, 300, 8, 3.500, '#fff'); } },
];

const TEE = 'M120 160 Q150 170 180 160 L198 180 L186 200 L178 194 L178 246 Q150 252 122 246 L122 194 L114 200 L102 180Z';
const TOPS = [
  { id: 'tee', name: 'Heart tee', draw: c => `<path d="${TEE}" fill="${c}"/><path d="M134 162 Q150 176 166 162" stroke="${shade(c, -.2)}" stroke-width="3" fill="none"/>
    <path d="M150 226 C134 214 136 198 150 206 C164 198 166 214 150 226Z" fill="#fff" opacity=".9"/>` },
  { id: 'tank', name: 'Sparkle tank', draw: c => `<path d="M128 162 Q150 172 172 162 L178 232 Q150 240 122 232Z" fill="${c}"/><path d="M130 158 L134 174 M170 158 L166 174" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    ${star(150, 206, 9, 4, '#fff')}${star(136, 222, 4, 2, '#fff')}${star(166, 190, 4, 2, '#fff')}` },
  { id: 'sweater', name: 'Cozy sweater', draw: c => { const d = shade(c, -.2); return `
    ${M(`<path d="M121 162 C108 176 104 216 101 256 C100 266 99 274 99 282 L112 284 C113 276 116 264 119 252 C124 232 129 200 130 170Z" fill="${c}"/><path d="M99 272 L113 274" stroke="${d}" stroke-width="6"/>`)}
    <path d="M121 164 Q150 174 179 164 L178 248 Q150 256 122 248Z" fill="${c}"/><path d="M122 240 Q150 248 178 240" stroke="${d}" stroke-width="7" fill="none"/>

/* ---------- state ---------- */
const DEFAULT_COLOR = { dress: '#ff7eb6', top: '#ff7eb6', bottom: '#ff9f45', shoes: '#ff4f9a' };
function freshState(){
  return {
    skin: '#f6d3b8', eyes: '#4aa3df', hairStyle: 'long', hairColor: '#f2cf6b', doll: 'mia',
    dress: { id: 'ball', color: '#ff7eb6' }, top: null, bottom: null, shoes: { id: 'heels', color: '#ff4f9a' },
    extras: ['crown'], scene: 'castle', last: { ...DEFAULT_COLOR }
  };
}
let S = freshState();
try { const saved = JSON.parse(localStorage.getItem('dressdollie') || 'null'); if (saved && saved.skin && SCENES.some(x => x.id === saved.scene)) S = { ...freshState(), ...saved }; } catch (e) {}
const persist = () => { try { localStorage.setItem('dressdollie', JSON.stringify(S)); } catch (e) {} };
let tab = 'doll';

/* ---------- drawing the doll ---------- */
function dollInner(st, o = {}){
  const find = (list, id) => list.find(x => x.id === id);
  const hair = HAIR[st.hairStyle] || HAIR.long;
  let out = '';
  if (!o.noScene) out += find(SCENES, st.scene).draw();
  if (o.sceneOnly) return out;
  out += `<ellipse cx="150" cy="594" rx="72" ry="8" fill="#000" opacity=".15"/>`;
  out += '<g id="dollG">';
  for (const id of st.extras) { const e = find(EXTRAS, id); if (e && e.layer === 'back') out += e.draw(); }
  out += hair.back(st.hairColor);
  out += bodySVG(st);
  if (st.shoes) out += find(SHOES, st.shoes.id).draw(st.shoes.color);
  if (st.bottom) out += find(BOTTOMS, st.bottom.id).draw(st.bottom.color);
  if (st.dress) { const d = find(DRESSES, st.dress.id); out += d.draw(st.dress.color); }
  else if (st.top) out += find(TOPS, st.top.id).draw(st.top.color);
  out += faceSVG(st);
  out += hair.front(st.hairColor);
  for (const id of st.extras) { const e = find(EXTRAS, id); if (e && e.layer !== 'back') out += e.draw(); }
  return out + '</g>';
}
const svgOpen = vb => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">`;
function render(){
  $('#bg').innerHTML = dollInner(S, { sceneOnly: true });
  $('#doll').innerHTML = dollInner(S, { noScene: true });
  persist();
}

/* ---------- thumbnails ---------- */
function baseThumb(){ return { skin: S.skin, eyes: S.eyes, hairStyle: S.hairStyle, hairColor: S.hairColor, dress: null, top: null, bottom: null, shoes: null, extras: [], scene: 'castle', last: S.last }; }
function thumb(cat, item){
  const b = baseThumb();
  const sceneBlank = { noScene: true };
  switch (cat) {
    case 'doll':  b.skin = item.skin; b.eyes = item.eyes; b.hairStyle = item.hairStyle; b.hairColor = item.hairColor; break;
    case 'hair':  b.hairStyle = item.id; break;
    case 'dress': b.dress = { id: item.id, color: S.last.dress }; break;
    case 'top':   b.top = { id: item.id, color: S.last.top }; b.bottom = { id: 'mini', color: '#fff' }; break;
    case 'bottom': b.bottom = { id: item.id, color: item.dflt || S.last.bottom }; b.top = { id: 'tank', color: '#fff' }; break;
    case 'shoes': b.shoes = { id: item.id, color: S.last.shoes }; break;
    case 'extras': b.extras = [item.id]; b.dress = { id: 'party', color: '#ffd1ea' }; break;
    case 'scene': b.scene = item.id; return '<span class="pic">' + svgOpen(CROPS.scene) + dollInner(b, { sceneOnly: true }) + '</svg></span>';
  }
  return '<span class="pic">' + svgOpen(CROPS[cat]) + dollInner(b, sceneBlank).replace('id="dollG"', '') + '</svg></span>';
}

/* ---------- panel UI ---------- */
function buildTabs(){
  const t = $('#tabs');
  t.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tab'; b.role = 'tab'; b.dataset.id = c.id;
    b.setAttribute('aria-selected', c.id === tab);
    b.innerHTML = `<span class="ic">${c.icon}</span><span>${c.label}</span>`;
    b.onclick = () => { tab = c.id; buildTabs(); buildGrid(); };
    t.appendChild(b);
  });
}
function tile(inner, label, pressed, onclick, cls = ''){
  const b = document.createElement('button');
  b.className = 'tile ' + cls; b.setAttribute('aria-pressed', !!pressed); b.setAttribute('aria-label', label);
  b.innerHTML = inner; b.onclick = onclick;
  return b;
}
function swatchRow(colors, current, onpick){
  const row = document.createElement('div'); row.className = 'swatches';
  colors.forEach(c => {
    const s = document.createElement('button');
    s.className = 'sw'; s.style.background = c; s.setAttribute('aria-label', 'colour ' + c);
    s.setAttribute('aria-pressed', c.toLowerCase() === (current || '').toLowerCase());
    s.onclick = () => onpick(c);
    row.appendChild(s);
  });
  return row;
}
function sect(text){ const d = document.createElement('div'); d.className = 'sect'; d.textContent = text; return d; }

function buildGrid(){
  const g = $('#grid'), cb = $('#colorbar');
  g.innerHTML = ''; cb.hidden = true; cb.innerHTML = '';
  g.scrollTop = 0;
  const label = n => `<span class="nm">${n}</span>`;

  if (tab === 'doll') {
    DOLLS.forEach(d => g.appendChild(tile(thumb('doll', d) + label(d.name), d.name, S.doll === d.id, () => {
      Object.assign(S, { doll: d.id, skin: d.skin, eyes: d.eyes, hairStyle: d.hairStyle, hairColor: d.hairColor });
      changed(); buildGrid();
    })));
    g.appendChild(sect('Skin'));
    g.appendChild(swatchRow(SKINS, S.skin, c => { S.skin = c; S.doll = ''; changed(); buildGrid(); }));
    g.appendChild(sect('Eyes'));
    g.appendChild(swatchRow(EYES, S.eyes, c => { S.eyes = c; S.doll = ''; changed(); buildGrid(); }));
  }
  else if (tab === 'hair') {
    Object.entries(HAIR).forEach(([id, h]) => g.appendChild(tile(thumb('hair', { id }) + label(h.name), h.name, S.hairStyle === id, () => {
      S.hairStyle = id; S.doll = ''; changed(); buildGrid();
    })));
    g.appendChild(sect('Hair colour'));
    g.appendChild(swatchRow(HAIRS, S.hairColor, c => { S.hairColor = c; S.doll = ''; changed(); buildGrid(); }));
  }
  else if (tab === 'extras') {
    EXTRAS.forEach(e => g.appendChild(tile(thumb('extras', e) + label(e.name), e.name, S.extras.includes(e.id), () => {
      S.extras = S.extras.includes(e.id) ? S.extras.filter(x => x !== e.id) : [...S.extras, e.id];
      changed(S.extras.includes(e.id)); buildGrid();
    })));
    g.appendChild(tile('🚫', 'Take everything off', false, () => { S.extras = []; changed(false); buildGrid(); }, 'none'));
  }
  else if (tab === 'scene') {
    SCENES.forEach(s => g.appendChild(tile(thumb('scene', s) + label(s.name), s.name, S.scene === s.id, () => { S.scene = s.id; changed(); buildGrid(); })));
  }
  else {
    const list = LISTS[tab];
    const cur = S[tab];
    list.forEach(it => g.appendChild(tile(thumb(tab, it) + label(it.name), it.name, cur && cur.id === it.id, () => choose(tab, it))));
    if (tab !== 'dress' || true) {
      // "none" tile: tops/bottoms/shoes/dress can be removed (the doll keeps a safe default outfit)
      if (tab === 'shoes') g.appendChild(tile('🦶', 'Bare feet', !cur, () => { S.shoes = null; changed(false); buildGrid(); }, 'none'));
    }
    if (cur && !(list.find(i => i.id === cur.id) || {}).fixed) {
      cb.hidden = false;
      const l = document.createElement('span'); l.className = 'lbl'; l.textContent = '🎨 Colour';
      cb.appendChild(l);
      cb.appendChild(swatchRow(CLOTH, cur.color, c => {
        S[tab].color = c; S.last[tab] = c; changed(false); buildGrid();
      }));
      cb.lastChild.style.justifyContent = 'center';
    }
  }
}
function choose(cat, item){
  const color = item.dflt || (item.fixed ? '#ffffff' : S.last[cat]);
  S[cat] = { id: item.id, color };
  if (item.dflt) S.last[cat] = color;
  else if (cat === 'bottom' && S.last.bottom === '#5b8bd6') S.last.bottom = DEFAULT_COLOR.bottom;
  if (cat === 'dress') { S.top = null; S.bottom = null; }
  if (cat === 'top') { S.dress = null; if (!S.bottom) S.bottom = { id: 'mini', color: S.last.bottom }; }
  if (cat === 'bottom') { S.dress = null; if (!S.top) S.top = { id: 'tee', color: S.last.top }; }
  changed(); buildGrid();
}

/* ---------- fun stuff ---------- */
let soundOn = true, actx;
function chime(){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + i * .08);
      g.gain.exponentialRampToValueAtTime(.12, t + i * .08 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .08 + .35);
      o.connect(g); g.connect(actx.destination);
      o.start(t + i * .08); o.stop(t + i * .08 + .4);
    });
  } catch (e) {}
}
function sparkles(){
  const st = $('#stage'), r = st.getBoundingClientRect();
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle'; s.textContent = ['✦', '✧', '★', '💖'][i % 4];
    s.style.left = (r.width * (.3 + Math.random() * .4)) + 'px';
    s.style.top = (r.height * (.15 + Math.random() * .6)) + 'px';
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    s.style.setProperty('--dy', (Math.random() * -90 - 10) + 'px');
    st.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function changed(celebrate = true){
  render();
  if (celebrate !== false) { sparkles(); chime(); }
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function surprise(){
  const d = pick(DOLLS);
  S.skin = pick(SKINS); S.eyes = pick(EYES); S.hairStyle = pick(Object.keys(HAIR)); S.hairColor = pick(HAIRS); S.doll = '';
  if (Math.random() < .55) {
    const it = pick(DRESSES); S.dress = { id: it.id, color: it.fixed ? '#fff' : pick(CLOTH.slice(0, 10)) }; S.top = null; S.bottom = null;
  } else {
    const t = pick(TOPS), b = pick(BOTTOMS);
    S.dress = null; S.top = { id: t.id, color: pick(CLOTH.slice(0, 10)) }; S.bottom = { id: b.id, color: b.dflt || pick(CLOTH.slice(0, 10)) };
  }
  const sh = pick(SHOES); S.shoes = { id: sh.id, color: pick(CLOTH.slice(0, 10)) };
  S.extras = EXTRAS.filter(() => Math.random() < .3).map(e => e.id);
  S.scene = pick(SCENES).id;
  changed(); buildGrid();
}
function save(){
  const svg = $('#doll').cloneNode(false);
  svg.removeAttribute('id');
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  svg.setAttribute('width', 600); svg.setAttribute('height', 1280);
  svg.innerHTML = dollInner(S).replace('id="dollG"', '');
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 600; c.height = 1280;
    c.getContext('2d').drawImage(img, 0, 0, 600, 1280);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'my-doll.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
}

$('#btnSurprise').onclick = surprise;
$('#btnReset').onclick = () => { S = freshState(); changed(); buildGrid(); };
$('#btnSave').onclick = save;
$('#btnTwirl').onclick = () => { const st = $('#stage'); st.classList.remove('twirl'); void st.offsetWidth; st.classList.add('twirl'); sparkles(); chime(); };
$('#btnSound').onclick = e => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇'; };

buildTabs(); buildGrid(); render();
</script>
</body>
